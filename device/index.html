<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Configuration</title>
    <style>
        /* Mobile-first Premium Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            background-color: #0a0a0c;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .card-container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 440px;
            background: rgba(18, 18, 24, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Beautiful Responsive Dashboard Style Buttons */
        .choice-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 18px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        .arrow {
            color: #6366f1;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card-container">
        <h1>Select Your System Type</h1>
        <p>Choose your active hardware platform below to check system link compatibility.</p>
        
        <div class="btn-group">
            <!-- Clicking these saves the choice in device memory and opens the questions page folder -->
            <button class="choice-btn" onclick="saveDevice('Mobile Phone')">
                <span>📱 Mobile Phone (iOS / Android)</span> 
                <span class="arrow">&rarr;</span>
            </button>
            <button class="choice-btn" onclick="saveDevice('Laptop / PC')">
                <span>💻 Desktop Laptop / PC</span> 
                <span class="arrow">&rarr;</span>
            </button>
        </div>
    </div>

    <script>
        function saveDevice(platformName) {
            // Save the device platform text to browser storage so the system remembers it
            localStorage.setItem('selectedDevice', platformName);
            // Move cleanly to your questions page folder
            window.location.href = '/questions';
        }
    </script>
</body>
</html>
