<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Triangle Rockers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
        body, html { height: 100%; background-color: #050507; color: #ffffff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .bg-glow { position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1; pointer-events: none; }
        .card-container { position: relative; z-index: 2; width: 92%; max-width: 420px; background: rgba(18, 18, 24, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 24px; padding: 40px 28px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
        .form-header { text-align: center; margin-bottom: 32px; }
        .form-header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; background: linear-gradient(to right, #ffffff, #c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .form-header p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
        .form-group { display: flex; flex-direction: column; gap: 18px; }
        .input-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; margin-bottom: 8px; }
        .input-field { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 16px; font-size: 15px; color: #ffffff; width: 100%; transition: all 0.2s ease; outline: none; }
        .input-field:focus { border-color: #6366f1; background: rgba(99, 102, 241, 0.02); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        .submit-btn { background: #6366f1; color: #ffffff; border: none; padding: 18px; font-size: 16px; font-weight: 700; border-radius: 14px; cursor: pointer; transition: all 0.2s ease; width: 100%; margin-top: 10px; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3); }
        .submit-btn:hover { background: #4f46e5; transform: translateY(-1px); }
        .secure-notice { text-align: center; font-size: 12px; color: #475569; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card-container">
        <div class="form-header">
            <h1>Create Account</h1>
            <p>Set up your free network credentials to unlock your verified gateway passes.</p>
        </div>
        
        <form id="signupForm" onsubmit="processSignup(event)">
            <div class="form-group">
                <div>
                    <label class="input-label">First Name</label>
                    <input type="text" id="userName" class="input-field" placeholder="e.g. John" required>
                </div>

                <div>
                    <label class="input-label">Email Address</label>
                    <input type="email" id="userEmail" class="input-field" placeholder="name@example.com" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Create Account & Continue &rarr;</button>
            </div>
        </form>

        <div class="secure-notice">🔒 Secure Cloud Storage Active</div>
    </div>

    <script>
        function processSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Processing Systems...";
            btn.disabled = true;

            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;

            // Target your specific Google Form hidden submit pipeline
            const formURL = 'https://google.com';
            
            // Build the data packet using your custom structural mapping entries
            const formData = new FormData();
            formData.append('entry.1265599461', name);
            formData.append('entry.1486853521', email);

            // Shoot data silently to Google Sheets database in the background
            fetch(formURL, {
                method: 'POST',
                mode: 'no-cors', // Bypasses browser security locks seamlessly
                body: formData
            })
            .then(() => {
                // Instantly advance them to the device page
                window.location.href = '/device';
            })
            .catch(() => {
                // Backup redirect path
                window.location.href = '/device';
            });
        }
    </script>
</body>
</html>
